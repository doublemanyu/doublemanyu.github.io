# ================================
# Basic Site Settings
# ================================
locale: "en-US"
title: "Nannan Yu"
title_separator: "|"
name: &name "Nannan Yu"
description: &description "Ph.D. student at Dalian University of Technology"

url: "https://doublemanyu.github.io"
baseurl: ""
repository: "doublemanyu/doublemanyu.github.io"


# ================================
# Author Information
# ================================
author:
  avatar: "ynn.png"
  name: "Nannan Yu"
  bio: "Ph.D. student at Dalian University of Technology."
  location: "Dalian, China"
  employer: "Dalian University of Technology"
  email: "nannanyu930606@gmail.com"

  # Academic profiles
  # googlescholar: "https://scholar.google.com/citations?user=PS_CX0AAAAAJ"
  # orcid: "https://orcid.org/0009-0008-1049-6317"

  # Code & repositories
  github: "doublemanyu"


# ================================
# Publications
# ================================
publication_category:
  manuscripts:
    title: "Journal Articles"
  conferences:
    title: "Conference Papers"


# ================================
# Site Behavior
# ================================
breadcrumbs: false
words_per_minute: 160
future: false
read_more: "disabled"
talkmap_link: false


# ================================
# Feed (disabled)
# ================================
atom_feed:
  hide: true


# ================================
# SEO & Analytics (disabled)
# ================================
analytics:
  provider: "false"


# ================================
# Files to Read
# ================================
include:
  - .htaccess
  - _pages
  - files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .bundle
  - .github
  - .jekyll-cache
  - .sass-cache
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
  - README
  - LICENSE
  - Dockerfile
  - log
  - tmp


# ================================
# Markdown & Conversion
# ================================
encoding: "utf-8"
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  toc_levels: 1..6


# ================================
# Collections
# ================================
collections:
  publications:
    output: true
    permalink: /publications/:path/
  research:
    output: true
    permalink: /research/:path/


# ================================
# Defaults
# ================================
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true

  - scope:
      path: ""
      type: research
    values:
      layout: single
      author_profile: true


# ================================
# Permalinks & Timezone
# ================================
permalink: /:categories/:title/
timezone: Etc/UTC


# ================================
# Plugins (minimal, GitHub Pages safe)
# ================================
plugins:
  - jekyll-gist
  - jemoji
  - jekyll-paginate
  - jekyll-sitemap


# ================================
# HTML Compression
# ================================
compress_html:
  clippings: all
  ignore:
    envs: development