{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
  (function () {
    var lang = 'en';
    try {
      var queryLang = new URLSearchParams(window.location.search).get('lang');
      lang = queryLang === 'zh' || queryLang === 'en' ? queryLang : localStorage.getItem('language');
      lang = lang === 'zh' ? 'zh' : 'en';
    } catch (e) {
      lang = 'en';
    }
    document.documentElement.setAttribute('data-lang', lang);
    document.documentElement.setAttribute('lang', lang === 'zh' ? 'zh-CN' : '{{ site.locale | slice: 0,2 }}');
  })();
</script>

<style>
  [data-lang-block][hidden],
  [data-lang-block="zh"] {
    display: none !important;
  }

  html[data-lang="zh"] [data-lang-block="en"] {
    display: none !important;
  }

  html[data-lang="zh"] div[data-lang-block="zh"] {
    display: block !important;
  }

  html[data-lang="zh"] span[data-lang-block="zh"] {
    display: inline !important;
  }
</style>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css?v={{ site.time | date: '%s' }}">
